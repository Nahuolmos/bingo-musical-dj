<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Bingo — Pantalla pública</title><style> *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#24121c 0,#08080c 65%);color:#f7f7fb;font:16px system-ui,Arial,sans-serif}.publicmode{min-height:100vh;display:grid;place-items:center;padding:25px;text-align:center}.publicbox{width:min(1100px,100%)}.brand{letter-spacing:.22em;color:#ff6470;font-weight:900;font-size:13px}.stage{margin:24px auto;width:min(330px,65vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(#ef3948,#ffb84d,#7049e8,#27c9b4,#ef3948);padding:9px;box-shadow:0 0 80px #ef394833}.wheel{height:100%;border-radius:50%;background:#111119;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:25px}.disc{font-size:52px}.wheel p{font-size:12px;color:#aaa;margin:5px}.title{font-size:clamp(30px,5vw,68px);line-height:1.08;margin:20px 0 8px}.artist{font-size:clamp(17px,2.4vw,30px);color:#c8c5d3}.hint{margin-top:30px;color:#79798b;font-size:12px}.history{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px auto;max-width:900px}.history span{border:1px solid #353543;border-radius:99px;padding:7px 11px;color:#c7c7d5;font-size:12px;background:#ffffff05}.count{color:#a6a6b7;font-size:13px;margin-top:12px}.waiting{color:#aaa;font-size:clamp(22px,3vw,38px);margin:10px}.pop{animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}</style></head><body><div class="publicmode"><div class="publicbox"><div class="brand">OLMOS NAHUEL PRESENTA · MUSIC BINGO</div><div class="stage"><div class="wheel"><div class="disc">♫</div><p id="status">ESPERANDO EL SORTEO</p></div></div><div id="waiting" class="waiting">¡Preparados para jugar!</div><div id="result" style="display:none"><div id="title" class="title"></div><div id="artist" class="artist"></div></div><div id="count" class="count">Canciones disponibles: 0</div><div id="history" class="history"></div><div class="hint">Escuchá la canción y marcala en tu cartón · ¡Mucha suerte!</div></div></div><script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function handleState(d){if(!d||d.type!=='state')return;document.getElementById('count').textContent='Canciones disponibles: '+d.remaining+' · Sorteadas: '+d.drawn;const r=d.current;if(r&&r.title){document.getElementById('status').textContent=r.status==='played'?'CANCIÓN REGISTRADA':r.status==='void'?'INCIDENCIA REGISTRADA':'CANCIÓN SORTEADA';document.getElementById('waiting').style.display='none';document.getElementById('result').style.display='block';document.getElementById('title').textContent=r.title;document.getElementById('artist').textContent=r.artist||'Artista no especificado';document.getElementById('result').classList.add('pop')}else{document.getElementById('status').textContent='ESPERANDO EL SORTEO';document.getElementById('waiting').style.display='block';document.getElementById('waiting').textContent='¡Preparados para jugar!';document.getElementById('result').style.display='none'}document.getElementById('history').innerHTML=(d.history||[]).slice(-5).reverse().map(h=>'<span>'+esc(h.title)+'</span>').join('')}var TRANSPORT_KEY='music-bingo-dj-on';var ch=null;try{ch=new BroadcastChannel('music-bingo-dj-on');ch.onmessage=function(e){handleState(e.data)};}catch(e){ch=null;}try{window.addEventListener('storage',function(e){if(!e||e.key!==TRANSPORT_KEY)return;try{handleState(JSON.parse(e.newValue));}catch(_){}});}catch(e){}try{if(window.localStorage){var raw=window.localStorage.getItem(TRANSPORT_KEY);if(raw){handleState(JSON.parse(raw));}}}catch(e){}window.addEventListener('keydown',e=>{if(e.key==='Escape')document.exitFullscreen?.()});</script></body></html>
